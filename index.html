<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skynet - Red Queen Core</title>
    <!-- Librería de WebSockets -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hologram-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        #subtexto {
            margin-top: 20px;
            font-size: 1.2rem;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="hologram-container">
        <h1>SKYNET // RED QUEEN</h1>
        <div id="subtexto">Sistemas en espera...</div>
    </div>

    <script>
        // CONÉCTATE AQUÍ CON LA URL DE TU SERVIDOR EN RENDER
        const socket = io("https://tu-backend-en-render.onrender.com");

        function reproducirVozSkynet(urlAudio) {
            if (!urlAudio) return;
            const audio = new Audio(urlAudio);
            audio.volume = 1.0;
            audio.play().catch(error => {
                console.log("Toque en pantalla requerido para audio:", error);
            });
        }

        socket.on('RESPUESTA_SKYNET', (data) => {
            document.getElementById('subtexto').innerText = data.texto;
            reproducirVozSkynet(data.audioUrl);
        });
    </script>
</body>
</html>
