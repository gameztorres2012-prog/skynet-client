<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Queen Interface</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        /* Proyección Holográfica a Pantalla Completa */
        .hologram-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hologram-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: drop-shadow(0 0 25px #ff0000) sepia(100%) hue-rotate(-50deg) saturate(600%) contrast(1.4);
            opacity: 0.85;
            animation: glitch-screen 2s infinite alternate;
        }

        /* Líneas de escaneo táctico superpuestas a toda la pantalla */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            background: linear-gradient(rgba(255, 0, 0, 0) 50%, rgba(255, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Interfaz táctica flotante superpuesta */
        .overlay-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(20,0,0,0.85) 100%);
        }

        /* Grilla de los 20 Nodos Remotos */
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: rgba(10, 0, 0, 0.75);
            border: 1px solid rgba(255, 0, 0, 0.8);
            padding: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            backdrop-filter: blur(3px);
        }

        .node-card {
            border: 1px solid #ff0000;
            padding: 8px 4px;
            font-size: 0.7rem;
            text-align: center;
            background: rgba(50, 0, 0, 0.5);
            color: #ffaaaa;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #ff0000;
        }

        .node-card.offline {
            border-color: #333;
            color: #444;
            background: rgba(10, 10, 10, 0.8);
            text-decoration: line-through;
            text-shadow: none;
        }

        @keyframes glitch-screen {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.9; }
            100% { opacity: 0.85; transform: scale(1.01); }
        }
    </style>
</head>
<body>

    <!-- Holograma Completo de la Reina Roja -->
    <div class="hologram-background">
        <img src="https://i.postimg.co/3w51S3C7/redqueen.gif" alt="Red Queen Full Screen" onerror="this.src='https://media.giphy.com/media/26tn33aiTi1jkl6H6/giphy.gif'">
    </div>

    <!-- Malla de escaneo táctico -->
    <div class="scanlines"></div>

    <!-- Capa de Interfaz y Nodos -->
    <div class="overlay-ui">
        <div class="nodes-grid" id="nodes-container"></div>
    </div>

    <script>
        const socket = io("https://skynet-core.onrender.com");

        // Construcción de la matriz de 20 computadores
        const nodesContainer = document.getElementById('nodes-container');
        for (let i = 1; i <= 20; i++) {
            const node = document.createElement('div');
            node.className = 'node-card';
            node.id = `node-${i}`;
            node.innerText = `PC-${i < 10 ? '0' + i : i}\nONLINE`;
            nodesContainer.appendChild(node);
        }

        socket.emit('REGISTRAR_DISPOSITIVO', "tablet_maestra");

        // Reconocimiento de voz en segundo plano
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const ultimo = event.results.length - 1;
                const textoTranscrito = event.results[ultimo][0].transcript.toLowerCase().trim();

                socket.emit('COMANDO_VOZ_RECIBIDO', {
                    textoComando: textoTranscrito,
                    biometriaVozValida: true 
                });
            };

            recognition.onend = () => {
                try { recognition.start(); } catch (e) {}
            };

            try { recognition.start(); } catch (e) {}
        }

        function hablarSkynet(texto) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.pitch = 0.45;
            utterance.rate = 0.85;
            
            const voices = window.speechSynthesis.getVoices();
            const voz = voices.find(v => v.lang.includes('es') && (v.name.includes('Google') || v.name.includes('Female')));
            if (voz) utterance.voice = voz;

            window.speechSynthesis.speak(utterance);
        }

        socket.on('RESPUESTA_SKYNET', (data) => {
            hablarSkynet(data.audioTexto);
        });

        // Evento de Purga Visual de Nodos
        socket.on('CLEAN_EXIT', () => {
            for (let i = 1; i <= 20; i++) {
                setTimeout(() => {
                    const n = document.getElementById(`node-${i}`);
                    if (n) {
                        n.className = 'node-card offline';
                        n.innerText = `PC-${i < 10 ? '0' + i : i}\nOFFLINE`;
                    }
                }, i * 120);
            }
            hablarSkynet("Protocolo Omega confirmado. Veinte nodos desconectados de la red.");
        });
    </script>
</body>
</html>
