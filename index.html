<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skynet - Tactical Interface</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #030303;
            color: #ff3333;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            border: 2px solid #ff3333;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
            background: rgba(15, 0, 0, 0.9);
            width: 100%;
            max-width: 650px;
        }
        h1 {
            font-size: 1.3rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 8px #ff0000;
        }
        .avatar-box {
            width: 180px;
            height: 180px;
            border: 2px solid #ff3333;
            margin: 0 auto 15px auto;
            position: relative;
            background: #000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: drop-shadow(0 0 10px #ff0000) contrast(1.2);
        }
        .avatar-box::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(255, 0, 0, 0) 50%, rgba(0, 0, 0, 0.5) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
        .status-box {
            margin: 15px 0;
            font-size: 0.95rem;
            font-weight: bold;
            min-height: 40px;
            color: #ff8888;
        }
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 15px;
            border-top: 1px solid #ff3333;
            padding-top: 15px;
        }
        .node-card {
            border: 1px solid #ff3333;
            padding: 5px;
            font-size: 0.65rem;
            background: rgba(40, 0, 0, 0.5);
            color: #ffaaaa;
        }
        .node-card.offline {
            border-color: #555;
            color: #555;
            background: #111;
            text-decoration: line-through;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CYBERDYNE SYSTEMS // SKYNET</h1>
        
        <div class="avatar-box">
            <img src="https://i.ibb.co/L5C1z5Q/red-queen-avatar.gif" alt="Reina Roja" onerror="this.src='https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcG9sbnhucHZ5bmE0OG50Z2thMnVxeHVqOTBzbjU3OWsydXBhNXk3MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26tn33aiTi1jkl6H6/giphy.gif'">
        </div>

        <div class="status-box" id="estado-texto">INICIANDO ESCUCHA MANOS LIBRES...</div>
        
        <div style="font-size: 0.75rem; color: #ff5555; margin-bottom: 10px;">🔴 MICRÓFONO ACTIVO 24/7 (MANOS LIBRES)</div>

        <div style="font-size: 0.75rem; letter-spacing: 1px;">NODOS EN RED (20/20 ACTIVOS)</div>
        <div class="nodes-grid" id="nodes-container"></div>
    </div>

    <script>
        const socket = io("https://skynet-core.onrender.com");

        const nodesContainer = document.getElementById('nodes-container');
        for (let i = 1; i <= 20; i++) {
            const node = document.createElement('div');
            node.className = 'node-card';
            node.id = `node-${i}`;
            node.innerText = `PC-${i < 10 ? '0' + i : i}\nONLINE`;
            nodesContainer.appendChild(node);
        }

        socket.emit('REGISTRAR_DISPOSITIVO', "tablet_maestra");

        socket.on('connect', () => {
            document.getElementById('estado-texto').innerText = "CONECTADO A RENDER // ESCUCHANDO VOZ...";
        });

        // Configuración de Reconocimiento de Voz Continuo (Manos Libres)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true; 
            recognition.interimResults = false;

            recognition.onstart = () => {
                document.getElementById('estado-texto').innerText = "ESCUCHANDO COMANDO EN VIVO...";
            };

            recognition.onresult = (event) => {
                const ultimo = event.results.length - 1;
                const textoTranscrito = event.results[ultimo][0].transcript.toLowerCase().trim();
                document.getElementById('estado-texto').innerText = `VOZ CAPTURADA: "${textoTranscrito}"`;

                socket.emit('COMANDO_VOZ_RECIBIDO', {
                    textoComando: textoTranscrito,
                    biometriaVozValida: true 
                });
            };

            recognition.onend = () => {
                try { recognition.start(); } catch (e) {}
            };

            try { recognition.start(); } catch (e) {}
        } else {
            alert("Usa Google Chrome en tu tablet.");
        }

        function hablarSkynet(texto) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.pitch = 0.5;
            utterance.rate = 0.85;
            
            const voices = window.speechSynthesis.getVoices();
            const voz = voices.find(v => v.lang.includes('es') && (v.name.includes('Google') || v.name.includes('Female')));
            if (voz) utterance.voice = voz;

            window.speechSynthesis.speak(utterance);
        }

        socket.on('RESPUESTA_SKYNET', (data) => {
            document.getElementById('estado-texto').innerText = "SK: " + data.audioTexto;
            hablarSkynet(data.audioTexto);
        });

        socket.on('CLEAN_EXIT', () => {
            document.getElementById('estado-texto').innerText = "¡PURGA ACTIVA! APAGANDO 20 EQUIPOS DE LA RED...";
            for (let i = 1; i <= 20; i++) {
                setTimeout(() => {
                    const n = document.getElementById(`node-${i}`);
                    if (n) {
                        n.className = 'node-card offline';
                        n.innerText = `PC-${i < 10 ? '0' + i : i}\nAPAGADO`;
                    }
                }, i * 150);
            }
            hablarSkynet("Protocolo Omega confirmado. Veinte computadores desconectados y apagados de la red Wi-Fi.");
        });
    </script>
</body>
</html>
