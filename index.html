<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skynet - Red Queen Interface</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #020000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }
        body.active-alert {
            background-color: #300000;
        }
        .container {
            text-align: center;
            border: 2px solid #ff0000;
            padding: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
            background: rgba(10, 0, 0, 0.95);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0000;
        }
        /* Contenedor Holográfico de la Reina Roja */
        .avatar-box {
            width: 200px;
            height: 200px;
            border: 2px solid #ff0000;
            margin: 0 auto 15px auto;
            position: relative;
            background: #000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8), inset 0 0 15px rgba(255, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: drop-shadow(0 0 12px #ff0000) sepia(100%) hue-rotate(-50deg) saturate(600%) contrast(1.3);
            animation: pulse-hologram 1.5s infinite alternate;
        }
        @keyframes pulse-hologram {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }
        /* Líneas de escaneo estilo película */
        .avatar-box::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(255, 0, 0, 0) 50%, rgba(255, 0, 0, 0.2) 50%);
            background-size: 100% 3px;
            pointer-events: none;
        }
        .status-indicator {
            font-size: 0.8rem;
            color: #ff4444;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        /* Grilla de Nodos */
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 10px;
            border-top: 1px solid #ff0000;
            padding-top: 10px;
        }
        .node-card {
            border: 1px solid #ff0000;
            padding: 4px;
            font-size: 0.6rem;
            background: rgba(40, 0, 0, 0.6);
            color: #ff8888;
        }
        .node-card.offline {
            border-color: #444;
            color: #444;
            background: #111;
            text-decoration: line-through;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h1>CYBERDYNE SYSTEMS // RED QUEEN</h1>
        
        <!-- Silueta Holográfica de la Reina Roja -->
        <div class="avatar-box">
            <img src="https://media.giphy.com/media/13ZHjidRzoi7n2/giphy.gif" alt="Red Queen Hologram">
        </div>

        <div class="status-indicator" id="estado-texto">SISTEMA ACTIVO // ESCUCHANDO RED</div>

        <div style="font-size: 0.7rem; letter-spacing: 1px; color: #ff6666; margin-bottom: 5px;">ESTADO DE NODOS REMOTOS (20/20)</div>
        <div class="nodes-grid" id="nodes-container"></div>
    </div>

    <script>
        const socket = io("https://skynet-core.onrender.com");

        // Generar los 20 nodos en pantalla
        const nodesContainer = document.getElementById('nodes-container');
        for (let i = 1; i <= 20; i++) {
            const node = document.createElement('div');
            node.className = 'node-card';
            node.id = `node-${i}`;
            node.innerText = `PC-${i < 10 ? '0' + i : i}\nONLINE`;
            nodesContainer.appendChild(node);
        }

        socket.emit('REGISTRAR_DISPOSITIVO', "tablet_maestra");

        // Reconocimiento de voz continuo (Manos libres absoluto)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const ultimo = event.results.length - 1;
                const textoTranscrito = event.results[ultimo][0].transcript.toLowerCase().trim();

                socket.emit('COMANDO_VOZ_RECIBIDO', {
                    textoComando: textoTranscrito,
                    biometriaVozValida: true 
                });
            };

            recognition.onend = () => {
                try { recognition.start(); } catch (e) {}
            };

            try { recognition.start(); } catch (e) {}
        }

        function hablarSkynet(texto) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.pitch = 0.45; // Voz grave robótica
            utterance.rate = 0.85;
            
            const voices = window.speechSynthesis.getVoices();
            const voz = voices.find(v => v.lang.includes('es') && (v.name.includes('Google') || v.name.includes('Female')));
            if (voz) utterance.voice = voz;

            window.speechSynthesis.speak(utterance);
        }

        // Cuando responde Skynet, NO muestra texto, solo activa efectos visuales y voz
        socket.on('RESPUESTA_SKYNET', (data) => {
            document.body.classList.add('active-alert');
            setTimeout(() => document.body.classList.remove('active-alert'), 1000);
            hablarSkynet(data.audioTexto);
        });

        // Protocolo de purga real
        socket.on('CLEAN_EXIT', () => {
            document.getElementById('estado-texto').innerText = "¡PROTOCOLO OMEGA ACTIVADO!";
            document.body.style.backgroundColor = "#500000";
            
            for (let i = 1; i <= 20; i++) {
                setTimeout(() => {
                    const n = document.getElementById(`node-${i}`);
                    if (n) {
                        n.className = 'node-card offline';
                        n.innerText = `PC-${i < 10 ? '0' + i : i}\nOFFLINE`;
                    }
                }, i * 150);
            }
            hablarSkynet("Protocolo Omega confirmado. Nodos desconectados de la red.");
        });
    </script>
</body>
</html>
