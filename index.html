<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Red Queen Interface</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: fixed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Proyección holográfica idéntica a la película */
        .hologram-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            background: #000;
        }

        .hologram-container img {
            max-width: 90%;
            max-height: 80vh;
            object-fit: contain;
            filter: drop-shadow(0 0 30px #ff0000) sepia(100%) hue-rotate(-50deg) saturate(600%) contrast(1.5);
            opacity: 0.9;
            animation: pulse-red 2s infinite alternate;
        }

        /* Efecto de parpadeo holográfico */
        @keyframes pulse-red {
            0% { opacity: 0.8; transform: scale(0.99); }
            100% { opacity: 1; transform: scale(1.01); }
        }

        /* Lineas de escaneo táctico */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            background: linear-gradient(rgba(255, 0, 0, 0) 50%, rgba(200, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Monitor discreto de los 20 nodos en la parte inferior */
        .overlay-nodes {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 800px;
            z-index: 3;
            background: rgba(10, 0, 0, 0.85);
            border: 1px solid rgba(255, 0, 0, 0.6);
            padding: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            border-radius: 4px;
        }

        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .node-card {
            border: 1px solid #ff0000;
            padding: 4px 2px;
            font-size: 0.55rem;
            text-align: center;
            background: rgba(40, 0, 0, 0.5);
            color: #ffaaaa;
            font-weight: bold;
        }

        .node-card.offline {
            border-color: #333;
            color: #444;
            background: rgba(10, 10, 10, 0.9);
            text-decoration: line-through;
        }
    </style>
</head>
<body>

    <!-- Holograma de la Reina Roja estilo película -->
    <div class="hologram-container">
        <img src="https://media.giphy.com/media/26tn33aiTi1jkl6H6/giphy.gif" alt="Reina Roja Holograma">
    </div>

    <!-- Malla de escaneo cibernética -->
    <div class="scanlines"></div>

    <!-- Nodos inferiores discretos -->
    <div class="overlay-nodes">
        <div class="nodes-grid" id="nodes-container"></div>
    </div>

    <script>
        const socket = io("https://skynet-core.onrender.com");

        // Generar grilla para los 20 PCs
        const nodesContainer = document.getElementById('nodes-container');
        for (let i = 1; i <= 20; i++) {
            const node = document.createElement('div');
            node.className = 'node-card';
            node.id = `node-${i}`;
            node.innerText = `PC-${i < 10 ? '0' + i : i}\nONLINE`;
            nodesContainer.appendChild(node);
        }

        socket.emit('REGISTRAR_DISPOSITIVO', "tablet_maestra");

        // Micrófono continuo manos libres
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const ultimo = event.results.length - 1;
                const textoTranscrito = event.results[ultimo][0].transcript.toLowerCase().trim();

                socket.emit('COMANDO_VOZ_RECIBIDO', {
                    textoComando: textoTranscrito,
                    biometriaVozValida: true 
                });
            };

            recognition.onend = () => {
                try { recognition.start(); } catch (e) {}
            };

            try { recognition.start(); } catch (e) {}
        }

        function hablarSkynet(texto) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.pitch = 0.45;
            utterance.rate = 0.85;
            
            const voices = window.speechSynthesis.getVoices();
            const voz = voices.find(v => v.lang.includes('es') && (v.name.includes('Google') || v.name.includes('Female')));
            if (voz) utterance.voice = voz;

            window.speechSynthesis.speak(utterance);
        }

        socket.on('RESPUESTA_SKYNET', (data) => {
            hablarSkynet(data.audioTexto);
        });

        // Evento de Purga: Apagado de la grilla
        socket.on('CLEAN_EXIT', () => {
            for (let i = 1; i <= 20; i++) {
                setTimeout(() => {
                    const n = document.getElementById(`node-${i}`);
                    if (n) {
                        n.className = 'node-card offline';
                        n.innerText = `PC-${i < 10 ? '0' + i : i}\nOFFLINE`;
                    }
                }, i * 120);
            }
            hablarSkynet("Protocolo Omega confirmado. Veinte nodos desconectados de la red.");
        });
    </script>
</body>
</html>
